# The Gradle daemon needs real headroom for an Android build with Room/KSP
# annotation processing, R8, and Compose compilation. A too-low default here
# (some environments default to ~512MB) causes GC thrashing and can fail
# tasks like checkDebugAarMetadata or manifest processing outright rather
# than just running slowly. Lower to 2048m if this machine has 8GB RAM or
# less; raise to 6144m+ if it has 32GB+.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
