# Dependency review on every pull request (docs/SPEC.md §7 R86; the owner's
# §9 #35 decision: "dependency-review with the first PR"). It fails a PR that
# adds a dependency with a known vulnerability.
#
# GitHub's dependency graph cannot read Gradle build files by itself, so the
# job first resolves the build and submits its graph (Gradle's documented
# pattern), then reviews the PR's changes against it. Without that step only
# the GitHub Actions would be reviewed. Every action is pinned to a commit SHA
# with its version beside it (tools/workflow_check.py).
name: Dependency review

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # To submit the Gradle dependency graph.
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      # AGP has to configure the project to resolve it, and that needs an SDK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Submit the Gradle dependency graph
        uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Review the PR's dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The graph submitted a step ago can take a moment to be processed.
          retry-on-snapshot-warnings: true
          # Kotlin 2.1.0's build-cache deserialization advisory (medium),
          # fixed in Kotlin 2.4.20. Allowed by the owner until the Kotlin
          # upgrade, which removes this line (docs/SPEC.md §7 R86).
          allow-ghsas: GHSA-r937-wjx7-w2jp
