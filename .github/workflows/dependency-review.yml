# Dependency review on every pull request (docs/SPEC.md §7 R86; the owner's
# §9 #35 decision: "dependency-review with the first PR"). It fails a PR that
# adds a dependency with a known vulnerability.
#
# GitHub's dependency graph cannot read Gradle build files by itself, so the
# job first resolves the build and submits its graph (Gradle's documented
# pattern), then reviews the PR's changes against it. Without that step only
# the GitHub Actions would be reviewed. Every action is pinned to a commit SHA
# with its version beside it (tools/workflow_check.py).
name: Dependency review

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # To submit the Gradle dependency graph.
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # AGP has to configure the project to resolve it, and that needs an SDK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Submit the Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Review the PR's dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The graph submitted a step ago can take a moment to be processed.
          retry-on-snapshot-warnings: true
