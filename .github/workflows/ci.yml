# Two jobs, no dependency between them (docs/SPEC.md §7 R74):
#
#   verify        -- the §10 triad the ledger quotes by hand: assembleDebug,
#                    testDebugUnitTest, lintDebug, in ONE Gradle invocation
#                    (one configuration, one daemon; `--continue` so a failing
#                    test still lints, since the reports were R23's point).
#   release-gate  -- assembleRelease plus tools/r8_check.py, the R69 gate:
#                    R8 runs only on release, and the debug triad cannot see
#                    what it strips. Shares nothing with the triad, so it runs
#                    beside it; wall clock is the slower of the two, not the sum.
#
# This file used to hold one job on purpose ("splitting would triple the
# configuration cost"); that reasoning was about splitting the triad, which
# still is not split. Every action is pinned to a commit SHA with its version
# beside it, and tools/workflow_check.py refuses anything else.
#
# Billing note: runs on this private repository have failed in three seconds
# since 2026-09-13 ("recent account payments have failed"). That is the
# account, not these files; tools/workflow_check.py (actionlint + the pin
# check) is what verifies them until a run can be watched.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gradle-wrapper.jar is the one binary in the tree; this checks it
      # against Gradle's published checksums before anything runs it.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # JDK 21 to match gradle/gradle-daemon-jvm.properties (toolchainVersion=21)
      # and app/build.gradle.kts's jvmToolchain(21). Without it Gradle would try
      # to auto-provision a daemon JVM from foojay on every run.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Accepts SDK licences and exports ANDROID_HOME. The runner image does not
      # reliably carry API 36 (compileSdk/targetSdk 36, AGP 8.13.2), so AGP's own
      # sdkDownload fetches what is missing once this action has set the licences.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # The default list asks for the legacy `tools` package, which
        # cmdline-tools 16 no longer has; sdkmanager then exits 1.
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The lint gate itself lives in app/build.gradle.kts (abortOnError +
      # warningsAsErrors against lint-baseline.xml), so this fails on any
      # finding not already recorded in the baseline. Nothing to configure here.
      - name: Assemble, test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace --continue

      # if: always() so a failing run still uploads the report that explains it
      # -- the whole point of R23's finding was a report nobody opened.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  release-gate:
    name: Release build, R8 gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # The default list asks for the legacy `tools` package, which
        # cmdline-tools 16 no longer has; sdkmanager then exits 1.
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace

      # Glance maps placed widgets to their provider by class name, and without
      # the keep in app/proguard-rules.pro R8 merges the two GlanceAppWidget
      # subclasses into one (docs/SPEC.md §7 R69). A dropped keep does not fail
      # the build, so the gate reads the shipped DEX and asserts the names survived.
      - name: R8 kept the widget classes
        run: python3 tools/r8_check.py

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
