# CodeQL static analysis (docs/SPEC.md §7 R74; Appendix E F-19, medTimer's
# codeql.yml re-typed for this repository). Modest value for an app with no
# INTERNET permission, and not zero: the SQL strings in Migrations.kt and the
# zip handling in BackupZipWriter.kt are exactly what its java-kotlin queries
# look at.
#
# On a PRIVATE repository the analysis runs on any plan, but the upload to
# code scanning needs GitHub Advanced Security. So while the repository is
# private the results are kept as a run artifact instead, and the day it is
# public the upload switches itself back on. Every action is pinned to a
# commit SHA with its version beside it (tools/workflow_check.py).
name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '43 14 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # Required for every code-scanning upload.
      security-events: write
      # The two a private repository needs in addition.
      actions: read
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          languages: java-kotlin

      # The same toolchain ci.yml uses: JDK 21 for the daemon and the
      # toolchain, the SDK action for licences, AGP's sdkDownload for API 36.
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        # The default list asks for the legacy `tools` package, which
        # cmdline-tools 16 no longer has; sdkmanager then exits 1.
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # A manual build rather than autobuild: CodeQL's Kotlin extractor needs
      # to see the compile, and the debug variant is enough for it. Without
      # --no-build-cache, setup-gradle's restored cache answers the compile
      # tasks FROM-CACHE, kotlinc never runs, and the analysis finds no code.
      - name: Build
        run: ./gradlew assembleDebug --no-build-cache --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          category: '/language:java-kotlin'
          output: sarif
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

      - name: Keep the SARIF as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CodeQL SARIF
          path: sarif
          retention-days: 14
