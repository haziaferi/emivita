# CodeQL static analysis (docs/SPEC.md §7 R74; Appendix E F-19, medTimer's
# codeql.yml re-typed for this repository). Modest value for an app with no
# INTERNET permission, and not zero: the SQL strings in Migrations.kt and the
# zip handling in BackupZipWriter.kt are exactly what its java-kotlin queries
# look at.
#
# On a PRIVATE repository the analysis runs on any plan, but the upload to
# code scanning needs GitHub Advanced Security. So while the repository is
# private the results are kept as a run artifact instead, and the day it is
# public the upload switches itself back on. Every action is pinned to a
# commit SHA with its version beside it (tools/workflow_check.py).
name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '43 14 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # Required for every code-scanning upload.
      security-events: write
      # The two a private repository needs in addition.
      actions: read
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin

      # The same toolchain ci.yml uses: JDK 21 for the daemon and the
      # toolchain, the SDK action for licences, AGP's sdkDownload for API 37.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # The default list asks for the legacy `tools` package, which
        # cmdline-tools 16 no longer has; sdkmanager then exits 1.
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # A manual build rather than autobuild: CodeQL's Kotlin extractor needs
      # to see the compile, and the debug variant is enough for it. Without
      # --no-build-cache, setup-gradle's restored cache answers the compile
      # tasks FROM-CACHE, kotlinc never runs, and the analysis finds no code.
      - name: Build
        run: ./gradlew assembleDebug --no-build-cache --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:java-kotlin'
          output: sarif
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

      - name: Keep the SARIF as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CodeQL SARIF
          path: sarif
          retention-days: 14
