# OpenSSF Scorecard (docs/SPEC.md §7 R74; Appendix E F-20, medTimer's
# scorecard.yml re-typed). The checks that can move on a single-owner
# repository are the two this repository already keeps by hand -- pinned
# dependencies and token permissions -- and this makes them measured.
#
# The repository is public, so the default token reads everything but the
# branch-protection settings, and results are published (badge, REST API).
# Publishing only accepts a job whose steps are the four approved actions
# below: no `run:` steps, no job env. If the repository went private again,
# the analysis would need a read-only PAT as SCORECARD_TOKEN and the
# code-scanning upload GitHub Advanced Security.
name: Scorecard supply-chain security

on:
  # For the Branch-Protection check; only the default branch is supported.
  branch_protection_rule:
  # So the Maintained check sees an occasional run.
  schedule:
    - cron: '45 15 * * 2'
  push:
    branches: [master, main]

# Default permissions read-only; the job adds only what the uploads need.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # To upload the results to the code-scanning dashboard.
      security-events: write
      # To publish results and get a badge (public repositories only).
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Optional on a public repository: a fine-grained PAT, made per
          # https://github.com/ossf/scorecard-action#authentication-with-fine-grained-pat-optional
          # and stored as SCORECARD_TOKEN, enables the Branch-Protection check.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true

      - name: Upload SARIF as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: results.sarif
