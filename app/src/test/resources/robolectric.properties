# Robolectric 4.14.1 ships Android images up to SDK 35; this project's
# targetSdk is 36 (app/build.gradle.kts), and enabling
# testOptions.unitTests.isIncludeAndroidResources for the Compose UI tests
# (spec section 7 R47) is what first made Robolectric read that value at all --
# it now picks the SDK from the merged manifest instead of defaulting, and
# refuses targetSdk > maxSdk.
#
# Pinning here rather than with a per-class @Config keeps every Robolectric
# test in the project on one image, so a migration test and a UI test cannot
# silently diverge on platform behaviour. Raise this to match targetSdk when
# Robolectric ships a 36 image; it is a test-harness ceiling, not a statement
# about what the app supports.
sdk=35

# Run every Robolectric test against the stock Application, not the merged
# manifest's EmivitaApplication.
#
# EmivitaApplication.onCreate() calls System.loadLibrary("sqlcipher"), and that
# native library cannot load on the JVM -- which is exactly why the Room tests
# build an unencrypted in-memory database (see the sqlcipher-android note in
# app/build.gradle.kts). This line is not a new concession: before
# isIncludeAndroidResources was enabled, Robolectric synthesised a manifest
# that named android.app.Application anyway, so every existing test already ran
# this way. Naming it keeps that true now that the real manifest is being read,
# instead of turning a resources setting into an UnsatisfiedLinkError across
# the whole suite.
application=android.app.Application
